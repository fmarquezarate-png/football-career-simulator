<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trofeos · Football Career Simulator</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="page-header">
    <a href="../index.html">← Inicio</a>
    <h1>🏆 Sala de Trofeos</h1>
  </header>

  <div class="page-body">
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;">
      <select id="countryFilter" style="padding:0.6rem 0.8rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;">
        <option value="">Todos los países</option>
      </select>
      <select id="typeFilter" style="padding:0.6rem 0.8rem;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;">
        <option value="">Todos los tipos</option>
        <option value="league">Liga</option>
        <option value="cup">Copa Nacional</option>
        <option value="supercup">Supercopa</option>
        <option value="continental">Continental</option>
        <option value="world">Mundial</option>
      </select>
    </div>
    <div id="trophiesList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;"></div>
  </div>

  <script type="module" src="../js/trophies.js"></script>
</body>
</html>
